
# Parameters
nc: 4  # number of classes (sesuaikan dengan jumlah ras domba)
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# Backbone ResNet50
backbone:
  # [from, repeats, module, args]
  - [-1, 1, ResNetLayer, [3, 64, 1, True, 1]]      # 0-P1/2
  - [-1, 1, ResNetLayer, [64, 64, 1, False, 3]]    # 1-P2/4
  - [-1, 1, ResNetLayer, [256, 128, 2, False, 4]]  # 2-P3/8
  - [-1, 1, ResNetLayer, [512, 256, 2, False, 6]]  # 3-P4/16
  - [-1, 1, ResNetLayer, [1024, 512, 2, False, 3]] # 4-P5/32
  - [-1, 1, SPPF, [1024, 5]]                      # 5

# Head dengan GhostConv
head:
  - [-1, 1, nn.Identity, []]                       # 6: Simpan P5
  
  # Top-down path
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 7
  - [[-1, 3], 1, Concat, [1]]                     # 8: Concat P4
  - [-1, 3, C3Ghost, [512]]                        # 9
  
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 10
  - [[-1, 2], 1, Concat, [1]]                     # 11: Concat P3
  - [-1, 3, C3Ghost, [256]]                        # 12
  
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 13
  - [[-1, 1], 1, Concat, [1]]                     # 14: Concat P2
  - [-1, 3, C3Ghost, [128]]                        # 15: P2/4
  
  # Bottom-up path
  - [-1, 1, GhostConv, [128, 3, 2]]               # 16
  - [[-1, 12], 1, Concat, [1]]                    # 17: Concat P3
  - [-1, 3, C3Ghost, [256]]                       # 18: P3/8
  
  - [-1, 1, GhostConv, [256, 3, 2]]               # 19
  - [[-1, 9], 1, Concat, [1]]                     # 20: Concat P4
  - [-1, 3, C3Ghost, [512]]                       # 21: P4/16
  
  - [-1, 1, GhostConv, [512, 3, 2]]               # 22
  - [[-1, 6], 1, Concat, [1]]                     # 23: Concat P5
  - [-1, 3, C3Ghost, [1024]]                      # 24: P5/32
  
  # Detect layer
  - [[15, 18, 21, 24], 1, Detect, [nc]]           # Detect(P2, P3, P4, P5)
